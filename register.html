<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiRS - Onboard Switch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex flex-col md:flex-row m-0 p-0 overflow-x-hidden">
  <div id="sidebar-container"></div>

  <main class="flex-1 min-w-0 w-full overflow-x-hidden p-4 md:p-8">
    <div id="header-container"></div>

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl border border-slate-200 shadow-sm mt-4">
      <h1 class="text-2xl font-bold text-slate-800 mb-2">Onboard Infrastructure Switch</h1>
      <p class="text-slate-500 text-sm mb-6">Register a new switch profile and configure Netmiko authentication parameters.</p>

      <form id="register-switch-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Switch Custom Name / Hostname</label>
            <input type="text" id="sw-hostname" placeholder="e.g. SW-Core-01" class="w-full p-3 rounded-lg bg-slate-50 border border-slate-300 text-slate-800 focus:outline-none focus:border-blue-500" required />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Management IP Address</label>
            <input type="text" id="sw-ip" placeholder="e.g. 192.168.100.45" class="w-full p-3 rounded-lg bg-slate-50 border border-slate-300 text-slate-800 focus:outline-none focus:border-blue-500" required />
          </div>
        </div>

        <div class="border-t border-slate-100 pt-4 mt-2">
          <h3 class="text-sm font-bold text-slate-800 mb-3">SSH Credentials (Netmiko)</h3>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">SSH Username</label>
          <input type="text" id="sw-user" placeholder="admin" class="w-full p-3 rounded-lg bg-slate-50 border border-slate-300 text-slate-800 focus:outline-none focus:border-blue-500" required />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">SSH Password</label>
            <input type="password" id="sw-pass" placeholder="••••••••" class="w-full p-3 rounded-lg bg-slate-50 border border-slate-300 text-slate-800 focus:outline-none focus:border-blue-500" required />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Enable Secret</label>
            <input type="password" id="sw-secret" placeholder="••••••••" class="w-full p-3 rounded-lg bg-slate-50 border border-slate-300 text-slate-800 focus:outline-none focus:border-blue-500" required />
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-semibold p-3 rounded-lg text-white transition duration-200 mt-4 shadow-sm">
          Onboard Switch Profile
        </button>
      </form>
    </div>
  </main>

  <script src="assets/script.js"></script>
  <script>
  renderSidebar("register"); // Kept matching sidebar highlights
  renderHeader();

  document.getElementById("register-switch-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const formData = {
      hostname: document.getElementById("sw-hostname").value.trim(),
      ip_address: document.getElementById("sw-ip").value.trim(),
      username: document.getElementById("sw-user").value,
      password: document.getElementById("sw-pass").value,
      secret: document.getElementById("sw-secret").value,
      status: true
    };

    try {
      const response = await fetch(`${API_BASE_URL}/devices`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
      });

      if (response.ok) {
        alert("Switch integrated successfully and authentication mapped!");
        window.location.href = "devices.html";
      } else {
        alert("Failed to register switch profile framework ledger.");
      }
    } catch (error) {
      console.error("Error:", error);
      alert("Error connecting to server APIs.");
    }
  });
</script>
</body>
</html>
