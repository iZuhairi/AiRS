<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiRS - AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex flex-col md:flex-row m-0 p-0 overflow-x-hidden">
  <div id="sidebar-container"></div>

  <main class="flex-1 min-w-0 w-full overflow-x-hidden p-4 md:p-8 flex flex-col">
    <div id="header-container"></div>

    <div class="max-w-4xl w-full mx-auto bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col flex-1 min-h-[500px]">
      <div class="p-6 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600 font-bold text-lg">🤖</div>
          <div>
            <h2 class="text-lg font-bold text-slate-800">AegisOps AI Assistant</h2>
            <p class="text-xs text-slate-500">Powered by Llama 3.2 via Local Ollama Engine</p>
          </div>
        </div>
        <span class="px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-semibold">Engine Active</span>
      </div>

      <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 max-h-[400px]">
        <div class="flex gap-3">
          <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold flex-shrink-0">AI</div>
          <div class="bg-slate-50 p-4 rounded-xl rounded-tl-none border border-slate-200 text-sm text-slate-700 max-w-[80%]">
            Hello! I am your Automated Incident Response Assistant. How can I help you analyze port anomalies or network violations today?
          </div>
        </div>
      </div>

      <form id="ai-form" class="p-4 border-t border-slate-200 flex gap-2">
        <input type="text" id="user-input" placeholder="Ask AI to analyze logs or explain security policies..." class="flex-1 p-3 rounded-lg bg-slate-50 border border-slate-300 text-slate-800 focus:outline-none focus:border-blue-500 text-sm" required />
        <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition shadow-sm">
          Send
        </button>
      </form>
    </div>
  </main>

  <script>
    renderSidebar("ai");
    renderHeader();

    const chatBox = document.getElementById("chat-box");
    const aiForm = document.getElementById("ai-form");
    const userInput = document.getElementById("user-input");

    aiForm.addEventListener("submit", async function(e) {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      chatBox.innerHTML += `
        <div class="flex gap-3 justify-end">
          <div class="bg-blue-600 text-white p-4 rounded-xl rounded-tr-none text-sm max-w-[80%]">
            ${message}
          </div>
        </div>
      `;
      userInput.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingId = "loading-" + Date.now();
      chatBox.innerHTML += `
        <div id="${loadingId}" class="flex gap-3">
          <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold flex-shrink-0">AI</div>
          <div class="bg-slate-50 p-4 rounded-xl rounded-tl-none border border-slate-200 text-sm text-slate-500 italic">
            Analyzing network state...
          </div>
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`${API_BASE_URL}/ai-chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message })
        });
        const data = await response.json();

        const loadingElem = document.getElementById(loadingId);
        if (loadingElem) loadingElem.remove();

        chatBox.innerHTML += `
          <div class="flex gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xs font-bold flex-shrink-0">AI</div>
            <div class="bg-slate-50 p-4 rounded-xl rounded-tl-none border border-slate-200 text-sm text-slate-700 max-w-[80%] leading-relaxed whitespace-pre-wrap">
              ${data.reply}
            </div>
          </div>
        `;
      } catch (err) {
        const loadingElem = document.getElementById(loadingId);
        if (loadingElem) loadingElem.remove();

        chatBox.innerHTML += `
          <div class="flex gap-3">
            <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-xs font-bold flex-shrink-0">ERR</div>
            <div class="bg-red-50 p-4 rounded-xl rounded-tl-none border border-red-200 text-sm text-red-600 max-w-[80%]">
              Failed to connect to backend server. Make sure Python API is running!
            </div>
          </div>
        `;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
